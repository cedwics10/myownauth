# Batcave : API + front en une commande.
#   docker compose up -d   → http://localhost:8088 (port modifiable via BATCAVE_PORT ; ajouter --build après une modification du code)
# Tout est défini ici (Dockerfiles et config nginx inline), aucun autre fichier Docker n'est nécessaire.

name: batcave

services:
  api:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-slim
        WORKDIR /srv/app
        COPY app/package.json ./
        RUN npm install --omit=dev && npm cache clean --force
        COPY app/server.js app/db.js ./
        ENV NODE_ENV=production DB_PATH=/data/database.db
        EXPOSE 3000
        CMD ["node", "server.js"]
    environment:
      PORT: 3000
    volumes:
      - batcave-data:/data
    # Aucun port publié : tout passe par le front (nginx), qui relaie vers l'API.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/secrets').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Serveur du TP1, vérifié en direct par les onglets des phases 3.x.
  batcave-security:
    build:
      context: ./batcave-security
      dockerfile_inline: |
        # Image complète pour compiler bcrypt et better-sqlite3, image légère pour l'exécution.
        FROM node:22 AS deps
        WORKDIR /srv/batcave-security
        COPY package.json package-lock.json ./
        RUN npm ci --omit=dev

        FROM node:22-slim
        WORKDIR /srv/batcave-security
        COPY --from=deps /srv/batcave-security/node_modules ./node_modules
        COPY package.json server.js db.js ./
        COPY public ./public
        COPY private ./private
        # db.js ouvre database.db à côté de server.js : on le redirige vers le volume, sans toucher au code du TP.
        RUN mkdir /data && ln -s /data/database.db database.db
        EXPOSE 3000
        CMD ["node", "server.js"]
    # Publié seulement pour ouvrir le vrai Bat-Ordinateur (3000 à 3002 sont souvent pris).
    ports:
      - "${BATCAVE_SECURITY_PORT:-3100}:3000"
    volumes:
      - batcave-security-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/register.html').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  front:
    build:
      context: ./front
      dockerfile_inline: |
        FROM node:22 AS build
        WORKDIR /front
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY index.html vite.config.ts env.d.ts tsconfig.json tsconfig.app.json tsconfig.node.json ./
        COPY public ./public
        COPY src ./src
        RUN npm run build

        FROM nginx:1.27-alpine
        COPY --from=build /front/dist /usr/share/nginx/html
    configs:
      - source: nginx-conf
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "${BATCAVE_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
      batcave-security:
        condition: service_healthy
    restart: unless-stopped

configs:
  nginx-conf:
    content: |
      server {
        listen 80;
        root /usr/share/nginx/html;

        location /api/ {
          proxy_pass http://api:3000;
          proxy_set_header Host $$host;
        }

        # Serveur du TP1, pour les vérifications des phases 3.x.
        # WWW-Authenticate est renommé pour que le navigateur n'ouvre pas sa fenêtre de connexion.
        location /batcave-security/ {
          proxy_pass http://batcave-security:3000/;
          proxy_set_header Host $$host;
          proxy_hide_header WWW-Authenticate;
          add_header X-WWW-Authenticate $$upstream_http_www_authenticate always;
          add_header Cache-Control "no-store" always;
        }

        # Fichiers versionnés par Vite : cache long.
        location /assets/ {
          add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Routes de l'application Vue (history mode) : jamais en cache, pour toujours charger la dernière version.
        location / {
          add_header Cache-Control "no-cache";
          try_files $$uri $$uri/ /index.html;
        }
      }

volumes:
  batcave-data:
  batcave-security-data:
