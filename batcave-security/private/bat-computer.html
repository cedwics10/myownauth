<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bat-Ordinateur — Batcave</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    .arsenal {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }
  </style>
</head>
<body class="bg-dark text-light">
  <main class="container py-5">
    <h1 class="h3 mb-1">Bat-Ordinateur</h1>
    <p id="welcome" class="lead text-warning mb-4">Identification requise.</p>

    <form id="login-form" class="mb-4" style="max-width: 420px;">
      <p class="text-secondary small">Confirmez votre identité pour déverrouiller les données sensibles.</p>
      <div class="mb-3">
        <label for="username" class="form-label">Nom d’utilisateur</label>
        <input type="text" id="username" name="username" class="form-control" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Mot de passe</label>
        <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-warning w-100">Déverrouiller</button>
    </form>

    <div id="message" class="alert d-none" role="status"></div>

    <div id="vault" class="d-none">
      <section class="mb-5">
        <h2 class="h4 mb-3">Arsenal</h2>
        <div id="arsenal" class="arsenal"></div>
      </section>

      <section style="max-width: 640px;">
        <h2 class="h4 mb-3">Rapport de mission</h2>
        <form id="report-form">
          <div class="mb-3">
            <label for="content" class="form-label">Note de mission</label>
            <textarea id="content" name="content" class="form-control" rows="4" maxlength="2000" required></textarea>
          </div>
          <button type="submit" class="btn btn-outline-warning">Enregistrer le rapport</button>
        </form>
      </section>
    </div>
  </main>

  <script>
    const loginForm = document.getElementById('login-form');
    const reportForm = document.getElementById('report-form');
    const welcome = document.getElementById('welcome');
    const message = document.getElementById('message');
    const vault = document.getElementById('vault');
    const arsenal = document.getElementById('arsenal');

    // Le navigateur n'ajoute pas l'en-tête Authorization aux appels fetch() :
    // on le construit à partir des identifiants saisis, gardés en mémoire seulement.
    const headers = new Headers();

    // Équivalent navigateur de Buffer.from(texte).toString('base64') :
    // btoa() seul échoue sur les caractères hors Latin-1 (é, emoji…).
    function toBase64(text) {
      const bytes = new TextEncoder().encode(text);
      return btoa(String.fromCharCode(...bytes));
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `alert alert-${type}`;
    }

    async function api(url, options = {}) {
      const response = await fetch(url, { ...options, headers });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(data.message || 'Erreur du serveur.');
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function renderArsenal(gadgets) {
      arsenal.replaceChildren();
      for (const gadget of gadgets) {
        const card = document.createElement('article');
        card.className = 'card h-100 bg-black text-light border-warning';

        const body = document.createElement('div');
        body.className = 'card-body';

        const icon = document.createElement('i');
        icon.className = `fa-solid ${gadget.icon} fa-2x text-warning mb-3`;
        icon.setAttribute('aria-hidden', 'true');

        const title = document.createElement('h3');
        title.className = 'h5 card-title';
        title.textContent = gadget.name;

        const desc = document.createElement('p');
        desc.className = 'card-text text-secondary';
        desc.textContent = gadget.desc;

        body.append(icon, title, desc);
        card.append(body);
        arsenal.append(card);
      }
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      headers.set('Authorization', 'Basic ' + toBase64(loginForm.elements.username.value + ':' + loginForm.elements.password.value));
      headers.set('Content-Type', 'application/json');

      try {
        const me = await api('/api/me');
        welcome.textContent = `Bienvenue, Justicier ${me.username}`;
        loginForm.reset();
        loginForm.classList.add('d-none');
        message.className = 'alert d-none';
        vault.classList.remove('d-none');

        renderArsenal(await api('/api/secrets'));
      } catch (err) {
        headers.delete('Authorization');
        showMessage(err.status === 401 ? 'Identifiants incorrects.' : err.message, 'danger');
      }
    });

    reportForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        const report = await api('/api/reports', {
          method: 'POST',
          body: JSON.stringify({ content: reportForm.elements.content.value }),
        });
        showMessage(`Rapport n°${report.id} enregistré.`, 'success');
        reportForm.reset();
      } catch (err) {
        showMessage(err.message, 'danger');
      }
    });
  </script>
</body>
</html>
